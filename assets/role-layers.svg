<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="t">
<title id="t">Role layers: enterprise, organization, team, repository</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#0f172a}.s{font-size:12px;fill:#334155}.b{font-weight:600}.l{stroke:#475569;stroke-width:1.5;fill:none}</style>
<rect width="360" height="400" fill="#fff"/>
<rect x="10" y="10" width="340" height="330" rx="12" fill="#dbeafe" stroke="#475569"/>
<text x="22" y="32" font-size="15" class="b">Enterprise</text>
<text x="22" y="50" class="s">owners · billing managers · custom roles (preview)</text>
<rect x="24" y="72" width="312" height="256" rx="12" fill="#ede9fe" stroke="#475569"/>
<text x="36" y="94" font-size="15" class="b">Organization</text>
<text x="36" y="112" class="s">owners · members · pre-defined + custom roles</text>
<rect x="38" y="134" width="284" height="182" rx="12" fill="#fef3c7" stroke="#475569"/>
<text x="50" y="156" font-size="15" class="b">Team</text>
<text x="50" y="174" class="s">maintainers · members (from Entra groups)</text>
<rect x="52" y="196" width="256" height="108" rx="12" fill="#dcfce7" stroke="#475569"/>
<text x="64" y="218" font-size="15" class="b">Repository</text>
<text x="64" y="236" class="s">read · triage · write · maintain · admin</text>
<text x="64" y="251" class="s">+ custom repository roles</text>
<text x="10" y="362" class="s">Grant at the lowest layer that works.</text><text x="10" y="378" class="s">Give access to teams, not to individuals.</text>
</svg>