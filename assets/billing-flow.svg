<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="billing-title billing-desc">
<title id="billing-title">GitHub Enterprise billing and cost attribution</title>
<desc id="billing-desc">GitHub product usage splits into seats and metered usage; assign a billing owner and use cost centers and budgets for metered products.</desc>
<defs><marker id="billing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#0f172a}.sub{font-size:13px;fill:#475569}.title{font-size:15px;font-weight:600}.path{stroke:#475569;stroke-width:2;fill:none}</style>
<rect width="760" height="280" rx="8" fill="#fff"/>
<path class="path" d="M202 140H246V88H286" marker-end="url(#billing-arrow)"/>
<path class="path" d="M246 140V192H286" marker-end="url(#billing-arrow)"/>
<path class="path" d="M482 88H542" marker-end="url(#billing-arrow)"/>
<path class="path" d="M482 192H542" marker-end="url(#billing-arrow)"/>
<rect x="24" y="94" width="178" height="92" rx="10" fill="#f1f5f9" stroke="#475569"/>
<text x="113" y="127" text-anchor="middle" class="title">GitHub products</text>
<text x="113" y="151" text-anchor="middle" class="sub">seats + metered use</text>
<rect x="286" y="42" width="196" height="92" rx="10" fill="#dbeafe" stroke="#475569"/>
<text x="384" y="76" text-anchor="middle" class="title">User seats</text>
<text x="384" y="100" text-anchor="middle" class="sub">fixed or usage-based</text>
<rect x="286" y="146" width="196" height="92" rx="10" fill="#ede9fe" stroke="#475569"/>
<text x="384" y="180" text-anchor="middle" class="title">Metered products</text>
<text x="384" y="204" text-anchor="middle" class="sub">Copilot, Actions, security</text>
<rect x="542" y="42" width="194" height="92" rx="10" fill="#fef3c7" stroke="#475569"/>
<text x="639" y="76" text-anchor="middle" class="title">Billing owner</text>
<text x="639" y="100" text-anchor="middle" class="sub">seat and payment oversight</text>
<rect x="542" y="146" width="194" height="92" rx="10" fill="#dcfce7" stroke="#475569"/>
<text x="639" y="180" text-anchor="middle" class="title">Cost centers + budgets</text>
<text x="639" y="204" text-anchor="middle" class="sub">allocate usage · optional Azure</text>
<text x="24" y="264" class="sub">Cost centers apply to metered usage, not volume seats.</text>
</svg>
