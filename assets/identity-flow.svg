<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 590" role="img" aria-labelledby="t">
<title id="t">Entra ID to GitHub: SSO for sign-in, SCIM for provisioning, groups to teams to repositories</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#0f172a}.s{font-size:12px;fill:#334155}.b{font-weight:600}.l{stroke:#475569;stroke-width:1.5;fill:none}</style>
<rect width="360" height="590" fill="#fff"/>
<rect x="10" y="10" width="340" height="56" rx="10" fill="#dbeafe" stroke="#475569"/><text x="180" y="33.8" text-anchor="middle" font-size="14" class="b">Microsoft Entra ID</text><text x="180" y="52" text-anchor="middle" font-size="14">people + groups: the source of truth</text>
<path class="l" d="M180 66L180 90" marker-end="url(#a)"/>
<rect x="10" y="90" width="340" height="56" rx="10" fill="#f1f5f9" stroke="#475569"/><text x="180" y="113.80000000000001" text-anchor="middle" font-size="14" class="b">GitHub enterprise application</text><text x="180" y="132" text-anchor="middle" font-size="14">assign groups, not individuals</text>
<path class="l" d="M95 146L95 170" marker-end="url(#a)"/>
<path class="l" d="M265 146L265 170" marker-end="url(#a)"/>
<rect x="10" y="170" width="165" height="96" rx="10" fill="#ede9fe" stroke="#475569"/><text x="92.5" y="197.20000000000002" text-anchor="middle" font-size="13" class="b">SSO</text><text x="92.5" y="214.10000000000002" text-anchor="middle" font-size="13">SAML, or OIDC</text><text x="92.5" y="231.00000000000003" text-anchor="middle" font-size="13">(managed users +</text><text x="92.5" y="247.90000000000003" text-anchor="middle" font-size="13">Entra only)</text>
<rect x="185" y="170" width="165" height="96" rx="10" fill="#dcfce7" stroke="#475569"/><text x="267.5" y="197.20000000000002" text-anchor="middle" font-size="13" class="b">SCIM</text><text x="267.5" y="214.10000000000002" text-anchor="middle" font-size="13">create, update,</text><text x="267.5" y="231.00000000000003" text-anchor="middle" font-size="13">suspend accounts</text><text x="267.5" y="247.90000000000003" text-anchor="middle" font-size="13">and group links</text>
<path class="l" d="M95 266L95 320" marker-end="url(#a)"/>
<path class="l" d="M265 266L265 320" marker-end="url(#a)"/>
<rect x="10" y="320" width="340" height="50" rx="10" fill="#f1f5f9" stroke="#475569"/><text x="180" y="349.9" text-anchor="middle" font-size="14" class="b">Enterprise → organizations</text>
<path class="l" d="M180 370L180 394" marker-end="url(#a)"/>
<rect x="10" y="394" width="340" height="50" rx="10" fill="#fef3c7" stroke="#475569"/><text x="180" y="423.9" text-anchor="middle" font-size="14" class="b">Teams ← linked Entra groups</text>
<path class="l" d="M180 444L180 468" marker-end="url(#a)"/>
<rect x="10" y="468" width="340" height="50" rx="10" fill="#f1f5f9" stroke="#475569"/><text x="180" y="497.9" text-anchor="middle" font-size="14" class="b">Repositories ← team roles</text>
<text x="10" y="540" class="s">Personal accounts: SAML at enterprise or org level;</text><text x="10" y="556" class="s">SCIM only per organization.</text><text x="10" y="572" class="s">Managed users: SCIM for the whole enterprise.</text>
</svg>